[package]
name = "pry-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "An interactive REPL breakpoint for Rust, inspired by Ruby's binding.pry"
license = "MIT"
repository = "https://github.com/100010/pry-rs"
readme = "README.md"
keywords = ["debug", "repl", "breakpoint", "pry", "inspect"]
categories = ["development-tools::debugging"]

[lib]
name = "pry"

[dependencies]
rustyline = { version = "18.0.1", optional = true }

[features]
default = ["readline"]
readline = ["dep:rustyline"]
